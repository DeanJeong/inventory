<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재고/마스터 관리 시스템</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 1. 로그인 카드 (중앙 정렬) */
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
    }

    .title-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .title-area h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .title-area p {
      font-size: 14px;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .msg-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
      line-height: 1.4;
    }

    .msg-box.error {
      display: block;
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fee2e2;
    }

    .msg-box.success {
      display: block;
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #dcfce7;
    }

    /* 2. 메인 대시보드 (사이드바 200px 고정 + 우측 가변 너비 레이아웃) */
    #main-screen {
      display: none;
      width: 100%;
      max-width: 1400px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .welcome-header {
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 24px;
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .welcome-header h2 {
      font-size: 18px;
      color: #0f172a;
    }

    .welcome-header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .logout-btn {
      padding: 8px 16px;
      font-size: 13px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .logout-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    /* 고정 너비 사이드바 200px 그리드 레이아웃 */
    .dashboard-container {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      min-height: 680px;
    }

    /* 좌측 사이드바 (고정 폭 200px) */
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 200px;
      min-width: 200px;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      background: transparent;
      border: none;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .nav-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .divider {
      height: 1px;
      background-color: #cbd5e1;
      margin: 8px 4px;
    }

    /* 우측 콘텐츠 영역 */
    .content-area {
      padding: 28px 32px;
      background-color: #ffffff;
      min-width: 0;
      overflow-x: auto;
    }

    .content-header {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .content-header h3 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .content-body {
      background: #ffffff;
      min-height: 520px;
    }

    /* 서브 탭 스타일 */
    .sub-tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }

    .sub-tab-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: -2px;
    }

    .sub-tab-btn:hover {
      color: #2563eb;
    }

    .sub-tab-btn.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    .placeholder-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 40px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #64748b;
    }

    /* 폼 스타일 */
    .master-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 24px;
    }

    .card-box h4 {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 24px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
    }

    .field-group input, .field-group select, .field-group textarea {
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
      border-color: #2563eb;
    }

    /* 시트 강조 스타일 */
    .field-group.highlight-yellow select, .field-group.highlight-yellow input {
      background-color: #fefce8;
      border-color: #fde047;
    }

    .field-group.highlight-blue input {
      background-color: #e0f2fe;
      border-color: #38bdf8;
      color: #0369a1;
      font-weight: 600;
    }

    .field-group input[readonly] {
      cursor: default;
    }

    .input-with-button {
      display: flex;
      gap: 8px;
    }

    .input-with-button input {
      flex: 1;
    }

    .search-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px 24px;
    }

    .search-form-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    /* 토글 스위치 버튼 스타일 */
    .toggle-group {
      display: inline-flex;
      background-color: #f1f5f9;
      border-radius: 6px;
      padding: 2px;
      border: 1px solid #cbd5e1;
    }

    .toggle-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #64748b;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
    }

    /* 좌우 스크롤 테이블 스타일 */
    .table-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow-x: auto;
      max-width: 100%;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    .data-table th, .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .data-table th {
      background-color: #f8fafc;
      color: #334155;
      font-weight: 600;
      font-size: 13px;
    }

    .data-table tbody tr:hover {
      background-color: #f1f5f9;
    }

    .memo-cell {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .memo-cell:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
    }

    .badge-skincare { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-makeup { background-color: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; }
    .badge-hair { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .badge-body { background-color: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
    .badge-homme { background-color: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
    .badge-tool { background-color: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }

    .status-badge-y { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; font-weight: 700; }
    .status-badge-n { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; font-weight: 700; }

    /* 모달 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(2px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #ffffff;
      width: 90%;
      max-width: 760px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }

    .modal-header {
      padding: 16px 24px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h4 {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: #64748b;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    .result-table th, .result-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .result-table th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 600;
    }

    .select-item-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .select-item-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen" class="login-card">
    <div class="title-area">
      <h1>시스템 로그인</h1>
      <p>사전 등록된 이메일 주소를 입력해 주세요.</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="userEmail">이메일 주소</label>
        <input 
          type="email" 
          id="userEmail" 
          class="input-field" 
          placeholder="example@skinapse.co.kr" 
          required 
          autocomplete="email"
        />
      </div>

      <button type="submit" id="submitBtn" class="btn">로그인</button>
      <div id="msgBox" class="msg-box"></div>
    </form>
  </div>

  <!-- 2. 인증 후 전환되는 메인 대시보드 화면 -->
  <div id="main-screen">
    <!-- 상단 헤더 -->
    <div class="welcome-header">
      <div>
        <h2>재고/마스터 관리 시스템</h2>
        <p>
          환영합니다, <strong id="displayUserName"></strong>님 (<span id="displayUserEmail"></span>)
        </p>
      </div>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>

    <!-- 200px 고정 사이드바 그리드 레이아웃 -->
    <div class="dashboard-container">
      <!-- 좌측 사이드바 -->
      <aside class="sidebar">
        <button class="nav-btn active" onclick="selectMenu('상품 마스터', this)">상품 마스터</button>
        <button class="nav-btn" onclick="selectMenu('협력사 마스터', this)">협력사 마스터</button>
        <button class="nav-btn" onclick="selectMenu('상품분류 마스터', this)">상품분류 마스터</button>
        <button class="nav-btn" onclick="selectMenu('패키지 마스터', this)">패키지 마스터</button>
        
        <div class="divider"></div>
        
        <button class="nav-btn" onclick="selectMenu('상품 입고', this)">상품 입고</button>
        <button class="nav-btn" onclick="selectMenu('재고 조회', this)">재고 조회</button>
        <button class="nav-btn" onclick="selectMenu('재고 조정', this)">재고 조정</button>
      </aside>

      <!-- 우측 콘텐츠 영역 -->
      <main class="content-area">
        <div class="content-header">
          <h3 id="currentMenuTitle">상품 마스터</h3>
        </div>
        <div class="content-body" id="contentDisplay">
          <!-- 동적 콘텐츠 영역 -->
        </div>
      </main>
    </div>
  </div>

  <!-- 공통 검색 결과 선택 모달 -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h4 id="modalTitle">검색 결과 선택</h4>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modalSubTitle" style="margin-bottom: 12px; color: #475569;">검색 결과가 여러 건 발견되었습니다. 불러올 항목을 선택하세요.</p>
        <table class="result-table">
          <thead>
            <tr id="modalTableHeader">
              <th>선택</th>
              <th>코드</th>
              <th>이름/명칭</th>
              <th>상세 정보</th>
            </tr>
          </thead>
          <tbody id="modalTableBody">
            <!-- 동적 검색 목록 생성 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Google Apps Script Web App URLs
    // -------------------------------------------------------------
    const GAS_AUTH_URL = "https://script.google.com/macros/s/AKfycbzuW6Chu_rFxPNGUVRja_esW40YPdOVbzsWD8cy8putOLVll5TkvDHuQhwOvTDNs5BL/exec";
    const GAS_PARTNER_URL = "https://script.google.com/macros/s/AKfycbzwfC5FMKhZr-dPeoW4trkqiDb7d0NSXae_4j-YOJI4JtTNs7o19nEFgThUOzGYhVNb/exec";
    const GAS_CATEGORY_URL = "https://script.google.com/macros/s/AKfycbw9f66MTYEIpSu_G7NJx3HuozpgfwM9Y0vKktJZEFsR5nns7DNl7kUwVeJRxAnOfCBm/exec";
    const GAS_PRODUCT_URL = "https://script.google.com/macros/s/AKfycbwuQAZ0nThwfu-9FnBTd2obmZslOf5xh9uGZbMlEzKMqJpk8iQbJ-nNvMRtT6yTuCtX/exec";
    const GAS_INBOUND_URL = "https://script.google.com/macros/s/AKfycbzOlUzkIMpMcOA52bMpdPhC2Psj6VZ_fUwMAJkK7t1362CUB5CwgMPVO9uOf75EZ0N_/exec";
    const GAS_PACKAGE_URL = "https://script.google.com/macros/s/AKfycbzRr1I0YrMHUB5nHN_I0og3jqZLAJTiPcKIG3HIOFvt77aqb1Z6A8RVC-7TCL22c3pp/exec";
    const GAS_ADJUST_URL = "https://script.google.com/macros/s/AKfycbwQn0jscGR8djmGnycMqy7HZOW1dV9xI3CUcWpV3Ud1y9RAV0SvKgj48TbT5lIyIggWqw/exec";
    
    // 현재 재고 전용 GAS Web App URL
    let GAS_STOCK_URL = localStorage.getItem("GAS_STOCK_URL") || "https://script.google.com/macros/s/AKfycbzGImHMCDK9BbEvd8kClwS1n4OtpZ1mkxiKYeTJDq-W01_PP6fTGI_nS5BZRPshkYh3/exec";

    const loginForm = document.getElementById("login-form");
    const userEmailInput = document.getElementById("userEmail");
    const submitBtn = document.getElementById("submitBtn");
    const msgBox = document.getElementById("msgBox");

    const loginScreen = document.getElementById("login-screen");
    const mainScreen = document.getElementById("main-screen");
    const displayUserName = document.getElementById("displayUserName");
    const displayUserEmail = document.getElementById("displayUserEmail");

    const currentMenuTitle = document.getElementById("currentMenuTitle");
    const contentDisplay = document.getElementById("contentDisplay");

    const resultModal = document.getElementById("resultModal");
    const modalTableBody = document.getElementById("modalTableBody");
    const modalTitle = document.getElementById("modalTitle");
    const modalSubTitle = document.getElementById("modalSubTitle");
    const modalTableHeader = document.getElementById("modalTableHeader");

    // 전역 캐시 데이터
    let cachedPartnerList = [];
    let cachedCategoryList = [];
    let cachedProductList = [];
    let cachedInboundList = [];
    let cachedPackageList = [];
    let cachedAdjustList = [];
    let cachedStockList = [];
    let multipleSearchResults = [];
    let modalSelectionCallback = null;

    let selectedProductCategoryLarge = "";
    let selectedProductCategoryMid = "";

    let currentSubTab = 'register';
    let currentInboundSubTab = 'register';
    let currentPackageSubTab = 'register';
    let currentAdjustSubTab = 'register';

    // 재고 조회 서특화 상태 변수 (과다 재고 기준 & 토글 & 정렬)
    let overstockThreshold = 50;  // 디폴트 50
    let isOverstockOnly = false;  // 과다 재고 상품만 보기 필터 상태

    function getFormattedNowTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
    }

    function getFormattedTodayDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function normalizeDateStr(dateStr) {
      if (!dateStr) return "";
      const str = String(dateStr).trim();
      
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        return str;
      }
      
      const parsedDate = new Date(str);
      if (!isNaN(parsedDate.getTime())) {
        const yyyy = parsedDate.getFullYear();
        const mm = String(parsedDate.getMonth() + 1).padStart(2, '0');
        const dd = String(parsedDate.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }
      
      const clean = str.replace(/\./g, '-').replace(/\s+/g, '');
      const parts = clean.split('T')[0].split('-');
      if (parts.length >= 3 && parts[0].length === 4) {
        const y = parts[0];
        const m = String(parts[1]).padStart(2, '0');
        const d = String(parts[2]).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return clean;
    }

    async function handleProductSubmit(e) {
      e.preventDefault();

      const prodCode = document.getElementById("prodCode").value.trim();
      const prodName = document.getElementById("prodName").value.trim();
      const categoryLarge = document.getElementById("prodCategoryLarge").value;
      const categoryMid = document.getElementById("prodCategoryMid").value;
      const vendorCode = document.getElementById("prodVendorCode").value;
      const vendorName = document.getElementById("prodVendorSearchKeyword").value.trim();
      const status = document.getElementById("prodStatus").value;
      const regDate = getFormattedNowTimestamp();
      const manager = document.getElementById("prodManager").value;
      const memo = document.getElementById("prodMemo").value.trim();

      if (!vendorCode) {
        alert("협력회사를 검색하여 선택해 주세요.");
        return;
      }

      if (cachedProductList.length === 0) {
        try {
          const res = await fetch(GAS_PRODUCT_URL);
          const result = await res.json();
          if (result && result.success && Array.isArray(result.data)) {
            cachedProductList = result.data;
          }
        } catch (e) { console.error(e); }
      }

      const isDuplicate = cachedProductList.some(item => {
        const existingCode = (item.productCode || item.product_code || item["상품코드"] || "").trim().toLowerCase();
        return existingCode === prodCode.toLowerCase();
      });

      if (isDuplicate) {
        alert(`❌ 이미 등록된 상품코드입니다. ('${prodCode}')\n다른 상품코드를 입력해 주세요.`);
        document.getElementById("prodCode").focus();
        return;
      }

      const payload = {
        productCode: prodCode,
        productName: prodName,
        categoryLarge: categoryLarge,
        categoryMid: categoryMid,
        vendorCode: vendorCode,
        vendorName: vendorName,
        status: status,
        regDate: regDate,
        memo: memo,
        manager: manager,

        product_code: prodCode,
        product_name: prodName,
        category_large: categoryLarge,
        category_mid: categoryMid,
        vendor_code: vendorCode,
        vendor_name: vendorName,
        operating_status: status,
        created_at: regDate,
        created_by: manager,

        "상품코드": prodCode,
        "상품명": prodName,
        "상품분류_대": categoryLarge,
        "상품분류_중": categoryMid,
        "협력회사 코드": vendorCode,
        "협력회사 명": vendorName,
        "운영상태": status,
        "최초 등록일": regDate,
        "메모": memo,
        "등록 담당자": manager
      };

      const btn = document.getElementById("prodSubmitBtn");
      btn.disabled = true;
      btn.textContent = "⏳ 등록 중입니다...";

      try {
        const queryParams = new URLSearchParams({
          action: "register",
          productCode: prodCode,
          productName: prodName,
          categoryLarge: categoryLarge,
          categoryMid: categoryMid,
          vendorCode: vendorCode,
          vendorName: vendorName,
          status: status,
          regDate: regDate,
          memo: memo,
          manager: manager
        }).toString();

        const postUrl = `${GAS_PRODUCT_URL}?${queryParams}`;

        await fetch(postUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        alert("✅ 성공적으로 등록되었습니다!");
        
        cachedProductList = [];
        switchProductSubTab('search');
      } catch (err) {
        console.error("Product Registration Error:", err);
        alert("등록 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "💾 상품 등록하기";

        filterMid.innerHTML = `<option value="">전체 (미설정)</option>`;
      } else {
        const matchedMids = cachedCategoryList
          .filter(item => item.categoryLarge === selectedLarge)
          .map(item => item.categoryMid);

        filterMid.innerHTML = `<option value="">전체 (미설정)</option>` +
          matchedMids.map(mid => `<option value="${mid}">${mid}</option>`).join("");
      }

      filterProductTable();
    }

    async function loadProductData(forceRefresh = false) {
      const tbody = document.getElementById("productTableBody");
      if (!tbody) return;

      if (!forceRefresh && cachedProductList.length > 0) {
        renderProductRows(cachedProductList);
        return;
      }

      tbody.innerHTML = `
        <tr>
          <td colspan="10" style="text-align: center; padding: 40px; color: #64748b;">
            ⏳ 상품 마스터 목록을 불러오는 중입니다...
          </td>
        </tr>
      `;

      try {
        const response = await fetch(GAS_PRODUCT_URL);
        const result = await response.json();

        if (result && result.success && Array.isArray(result.data)) {
          cachedProductList = result.data;
          renderProductRows(cachedProductList);
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="10" style="text-align: center; padding: 40px; color: #dc2626;">

            </tr>
          `;

            <td colspan="10" style="text-align: center; padding: 40px; color: #dc2626;">
              ⚠️ 통신 중 오류가 발생했습니다.
            </td>
          </tr>

    function renderProductRows(list) {
      const tbody = document.getElementById("productTableBody");
      if (!tbody) return;

      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; padding: 40px; color: #64748b;">
              등록된 상품 마스터가 없습니다. 신규 상품을 등록해 주세요.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map((item, index) => {
        const badgeClass = getBadgeClass(item.categoryLarge || item.category_large || item["상품분류_대"]);
        const statusVal = item.status || item.operating_status || item["운영상태"] || 'Y';
        const statusClass = statusVal === 'Y' ? 'status-badge-y' : 'status-badge-n';

        const code = item.productCode || item.product_code || item["상품코드"] || "-";
        const name = item.productName || item.product_name || item["상품명"] || "-";
        const catL = item.categoryLarge || item.category_large || item["상품분류_대"] || "-";
        const catM = item.categoryMid || item.category_mid || item["상품분류_중"] || "-";
        const vName = item.vendorName || item.vendor_name || item["협력회사 명"] || "-";
        const vCode = item.vendorCode || item.vendor_code || item["협력회사 코드"] || "-";
        
        const regD = item.registeredDate || item.regDate || item.created_at || item["최초 등록일"] || item["최초등록일"] || "-";
        const mgr = item.creator || item.manager || item.created_by || item["등록 담당자"] || item["등록담당자"] || "-";
        
        const rawMemo = item.memo || item["메모"] || "-";
        const escapedMemo = String(rawMemo).replace(/"/g, '&quot;');

        return `
          <tr>
            <td style="text-align: center; color: #94a3b8; font-weight: 600;">${index + 1}</td>
            <td><strong>${code}</strong></td>
            <td>${name}</td>
            <td><span class="badge ${badgeClass}">${catL}</span></td>
            <td>${catM}</td>
            <td>${vName} (${vCode})</td>
            <td style="text-align: center;"><span class="badge ${statusClass}">${statusVal}</span></td>
            <td style="font-size: 13px; color: #64748b;">${regD}</td>
            <td><strong style="color: #0369a1;">${mgr}</strong></td>
            <td class="memo-cell" title="${escapedMemo}">${rawMemo}</td>
          </tr>
        `;
      }).join("");
    }

    function filterProductTable() {
      const input = document.getElementById("prodSearchInput");
      const filterLargeSelect = document.getElementById("prodFilterCategoryLarge");
      const filterMidSelect = document.getElementById("prodFilterCategoryMid");

      const keyword = input ? input.value.trim().toLowerCase() : "";
      const selectedLarge = filterLargeSelect ? filterLargeSelect.value : "";
      const selectedMid = filterMidSelect ? filterMidSelect.value : "";

      const filtered = cachedProductList.filter(item => {
        const catL = (item.categoryLarge || item.category_large || item["상품분류_대"] || "");
        const catM = (item.categoryMid || item.category_mid || item["상품분류_중"] || "");

        if (selectedLarge && catL !== selectedLarge) {
          return false;
        }

        if (selectedMid && catM !== selectedMid) {
          return false;
        }

        if (keyword) {
          const code = (item.productCode || item.product_code || item["상품코드"] || "").toLowerCase();
          const name = (item.productName || item.product_name || item["상품명"] || "").toLowerCase();
          const vName = (item.vendorName || item.vendor_name || item["협력회사 명"] || "").toLowerCase();
          const vCode = (item.vendorCode || item.vendor_code || item["협력회사 코드"] || "").toLowerCase();
          const mgr = (item.creator || item.manager || item.created_by || item["등록 담당자"] || "").toLowerCase();
          const memo = (item.memo || item["메모"] || "").toLowerCase();

          const matchesKeyword = code.includes(keyword) || name.includes(keyword) || 
                                 catL.toLowerCase().includes(keyword) || catM.toLowerCase().includes(keyword) || 
                                 vName.includes(keyword) || vCode.includes(keyword) || mgr.includes(keyword) || memo.includes(keyword);
          if (!matchesKeyword) return false;
        }

        return true;
      });

      renderProductRows(filtered);
    }

    async function searchProductForPackageForm(itemIndex) {
      const inputEl = document.getElementById(`pkgSearchKeyword_${itemIndex}`);
      const keyword = inputEl.value.trim().toLowerCase();

      if (!keyword || keyword.length < 1) {
        alert("상품코드 또는 상품명을 1글자 이상 입력해 주세요.");
        return;
      }

      if (cachedProductList.length === 0) {
        try {
          const res = await fetch(GAS_PRODUCT_URL);
          const result = await res.json();
          if (result && result.success && Array.isArray(result.data)) {
            cachedProductList = result.data;
          }
        } catch (e) {
          alert("상품 마스터 데이터를 불러오지 못했습니다.");
          return;
        }
      }

      const filtered = cachedProductList.filter(item => {
        const code = (item.productCode || item.product_code || item["상품코드"] || "").toLowerCase();
        const name = (item.productName || item.product_name || item["상품명"] || "").toLowerCase();
        return code.includes(keyword) || name.includes(keyword);
      });

      if (filtered.length === 0) {
        alert(`⚠️ 상품 마스터에 등록되어 있지 않은 상품입니다.\n먼저 [상품 마스터] 메뉴에서 상품을 등록해 주세요.`);
      } else if (filtered.length === 1) {
        selectProductForPackageForm(itemIndex, filtered[0]);
      } else {
        multipleSearchResults = filtered;
        openModalWithCustomHeader(
          `📦 패키지 구성품 #${itemIndex + 1} 상품 선택`,
          `'${keyword}' 검색 결과 ${filtered.length}건이 발견되었습니다. 등록할 상품을 선택하세요.`,
          ["선택", "상품코드", "상품명", "대/중분류", "협력회사"],
          filtered.map(item => {
            const code = item.productCode || item.product_code || item["상품코드"] || "-";
            const name = item.productName || item.product_name || item["상품명"] || "-";
            const catL = item.categoryLarge || item.category_large || item["상품분류_대"] || "-";
            const catM = item.categoryMid || item.category_mid || item["상품분류_중"] || "-";
            const vName = item.vendorName || item.vendor_name || item["협력회사 명"] || "-";
            return `
              <td><strong>${code}</strong></td>
              <td>${name}</td>
              <td>${catL} / ${catM}</td>
              <td>${vName}</td>
            `;
          }),
          (modalIdx) => {
            selectProductForPackageForm(itemIndex, filtered[modalIdx]);
          }
        );
      }
    }

    function selectProductForPackageForm(itemIndex, product) {
      const targetObj = packageComponentItems[itemIndex];
      targetObj.productCode = product.productCode || product.product_code || product["상품코드"] || "";
      targetObj.productName = product.productName || product.product_name || product["상품명"] || "";
      targetObj.categoryLarge = product.categoryLarge || product.category_large || product["상품분류_대"] || "";
      targetObj.categoryMid = product.categoryMid || product.category_mid || product["상품분류_중"] || "";
      targetObj.vendorCode = product.vendorCode || product.vendor_code || product["협력회사 코드"] || "";
      targetObj.vendorName = product.vendorName || product.vendor_name || product["협력회사 명"] || "";

      renderPackageComponentRows();
    }

    async function handlePackageSubmit(e) {
      e.preventDefault();

      const shipDate = document.getElementById("pkgShipDate").value;
      const skinType = document.getElementById("pkgSkinType").value.trim();
      const shipQty = parseInt(document.getElementById("pkgShipQty").value, 10) || 0;
      const inspector = document.getElementById("pkgInspector").value;
      const regDate = getFormattedNowTimestamp();

      if (!shipDate || !skinType || shipQty <= 0) {
        alert("출고일, 피부타입 코드, 올바른 출고 수량을 입력해 주세요.");
        return;
      }

      for (let i = 0; i < packageComponentItems.length; i++) {
        const comp = packageComponentItems[i];
        if (!comp.productCode) {
          alert(`구성품 #${i + 1} 의 상품이 선택되지 않았습니다. 상품 마스터에서 상품을 선택해 주세요.`);
          return;
        }
      }

      const itemsPayload = packageComponentItems.map(item => ({
        shipDate: shipDate,
        skinType: skinType,
        shipQty: shipQty,
        productType: item.productType,
        categoryLarge: item.categoryLarge,
        categoryMid: item.categoryMid,
        vendorCode: item.vendorCode,
        vendorName: item.vendorName,
        productCode: item.productCode,
        productName: item.productName,
        packageQty: item.packageQty,
        inspector: inspector,
        regDate: regDate,

        "출고일": shipDate,
        "피부타입": skinType,
        "출고 수량": shipQty,
        "상품 유형": item.productType,
        "상품분류_대": item.categoryLarge,
        "상품분류_중": item.categoryMid,
        "협력회사 코드": item.vendorCode,
        "협력회사 명": item.vendorName,
        "상품코드": item.productCode,
        "상품명": item.productName,
        "패키지 포함 수량": item.packageQty,
        "검수자": inspector,
        "등록일": regDate
      }));

      const btn = document.getElementById("pkgSubmitBtn");
      btn.disabled = true;
      btn.textContent = "⏳ 패키지 등록 중입니다...";

      try {
        const response = await fetch(GAS_PACKAGE_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ items: itemsPayload })
        });

        const text = await response.text();
        let res = {};
        try { res = JSON.parse(text); } catch(pErr) {}

        if (res && res.success) {

    function renderPackageRows(list) {
      const tbody = document.getElementById("packageTableBody");
      if (!tbody) return;

      if (!list || list.length === 0) {
        tbody.innerHTML = `

        return;
      }

      tbody.innerHTML = list.map((item, index) => {
        const rawShipDate = item.shipDate || item["출고일"] || "-";
        const sDate = normalizeDateStr(rawShipDate) || String(rawShipDate).split('T')[0] || "-";
        const sType = item.skinType || item["피부타입"] || "-";
        const sQty = Number(item.shipQty || item["출고 수량"] || 0).toLocaleString();
        const pType = item.productType || item["상품 유형"] || "소형";
        const catL = item.categoryLarge || item["상품분류_대"] || "-";
        const catM = item.categoryMid || item["상품분류_중"] || "-";
        const vCode = item.vendorCode || item["협력회사 코드"] || "-";
        const vName = item.vendorName || item["협력회사 명"] || "-";
        const pCode = item.productCode || item["상품코드"] || "-";
        const pName = item.productName || item["상품명"] || "-";
        const pQty = Number(item.packageQty || item["패키지 포함 수량"] || 1).toLocaleString();
        const insp = item.inspector || item["검수자"] || "-";
        
        let rawRegD = item.regDate || item.createdAt || item["등록일"] || "-";
        let regD = rawRegD;
        if (rawRegD !== "-") {
          const normR = normalizeDateStr(rawRegD);
          const timePart = String(rawRegD).split(' ')[4] || String(rawRegD).split('T')[1]?.substring(0,8) || "";
          regD = normR ? (timePart ? `${normR} ${timePart}` : normR) : rawRegD;
        }

        const badgeClass = pType === '본품' ? 'status-badge-y' : 'badge-skincare';

        return `
          <tr>
            <td style="text-align: center; color: #94a3b8; font-weight: 600;">${index + 1}</td>
            <td><strong>${sDate}</strong></td>
            <td><span class="badge badge-body">${sType}</span></td>
            <td style="text-align: right; color: #2563eb; font-weight: 700;">${sQty} 세트</td>
            <td style="text-align: center;"><span class="badge ${badgeClass}">${pType}</span></td>
            <td>${catL}</td>
            <td>${catM}</td>
            <td>${vCode}</td>
            <td>${vName}</td>
            <td><strong>${pCode}</strong></td>
            <td>${pName}</td>
            <td style="text-align: right; color: #16a34a; font-weight: 700;">${pQty} 개</td>
            <td><strong style="color: #0369a1;">${insp}</strong></td>
            <td style="font-size: 13px; color: #64748b;">${regD}</td>
          </tr>
        `;
      }).join("");
    }

    function filterPackageTable() {
      const input = document.getElementById("pkgSearchInput");
      const fromInput = document.getElementById("pkgFilterFromDate");
      const toInput = document.getElementById("pkgFilterToDate");

      const keyword = input ? input.value.trim().toLowerCase() : "";
      const fromDate = fromInput ? fromInput.value : "";
      const toDate = toInput ? toInput.value : "";

      const filtered = cachedPackageList.filter(item => {
        const rawDate = item.shipDate || item["출고일"] || "";
        const normDate = normalizeDateStr(rawDate);

        if (fromDate && normDate && normDate < fromDate) {
          return false;
        }

        if (toDate && normDate && normDate > toDate) {
          return false;
        }

        if (keyword) {
          const sType = (item.skinType || item["피부타입"] || "").toLowerCase();
          const catL = (item.categoryLarge || item["상품분류_대"] || "").toLowerCase();
          const catM = (item.categoryMid || item["상품분류_중"] || "").toLowerCase();
          const vCode = (item.vendorCode || item["협력회사 코드"] || "").toLowerCase();
          const vName = (item.vendorName || item["협력회사 명"] || "").toLowerCase();
          const pCode = (item.productCode || item["상품코드"] || "").toLowerCase();
          const pName = (item.productName || item["상품명"] || "").toLowerCase();
          const insp = (item.inspector || item["검수자"] || "").toLowerCase();

          const matchesKeyword = sType.includes(keyword) || catL.includes(keyword) || 
                                 catM.includes(keyword) || vCode.includes(keyword) ||
                                 vName.includes(keyword) || pCode.includes(keyword) || 
                                 pName.includes(keyword) || insp.includes(keyword);
          if (!matchesKeyword) return false;
        }

        return true;
      });

      renderPackageRows(filtered);
    }

      const badQty = parseInt(document.getElementById("inboundBadQty").value, 10) || 0;
      const inspector = document.getElementById("inboundInspector").value;
      const regDate = getFormattedNowTimestamp();
      const memo = document.getElementById("inboundMemo").value.trim();

      if (!productCode || !vendorCode) {
        alert("상품 마스터에서 등록된 상품을 먼저 검색하여 선택해 주세요.");
        return;
      }

      const payload = {
        inboundCode: inboundCode,
        inboundDate: inboundDate,
        productCode: productCode,
        productName: productName,

    function filterInboundTable() {
      const input = document.getElementById("inboundSearchInput");
      const fromInput = document.getElementById("inboundFilterFromDate");
      const toInput = document.getElementById("inboundFilterToDate");

      const keyword = input ? input.value.trim().toLowerCase() : "";
      const fromDate = fromInput ? fromInput.value : "";
      const toDate = toInput ? toInput.value : "";

      const filtered = cachedInboundList.filter(item => {
        const rawInDate = item.inboundDate || item.inbound_date || item["상품 입고일"] || "";
        const normInDate = normalizeDateStr(rawInDate);

        if (fromDate && normInDate && normInDate < fromDate) {
          return false;
        }

        if (toDate && normInDate && normInDate > toDate) {
          return false;
        }

        if (keyword) {
          const inCode = (item.inboundCode || item.inbound_code || item["입고 코드"] || "").toLowerCase();
          const pCode = (item.productCode || item.product_code || item["상품코드"] || "").toLowerCase();
          const pName = (item.productName || item.product_name || item["상품명"] || "").toLowerCase();
          const vName = (item.vendorName || item.vendor_name || item["협력회사 명"] || "").toLowerCase();
          const insp = (item.inspector || item["검수자"] || "").toLowerCase();
          const memo = (item.memo || item["메모"] || "").toLowerCase();

          const matchesKeyword = inCode.includes(keyword) || pCode.includes(keyword) || 
                                 pName.includes(keyword) || vName.includes(keyword) || 
                                 insp.includes(keyword) || memo.includes(keyword);
          if (!matchesKeyword) return false;
        }

        return true;
      });

      renderInboundRows(filtered);
    }

    async function loadInventoryStockData(forceRefresh = false) {
      const tbody = document.getElementById("inventoryStockTableBody");
      if (!tbody) return;

      // 1. 상품 마스터 사전 캐싱 (모든 상품 목록의 기준)
      if (cachedProductList.length === 0) {
        try {
          const res = await fetch(GAS_PRODUCT_URL);
          const result = await res.json();
          if (result && result.success && Array.isArray(result.data)) {
            cachedProductList = result.data;
          }
        } catch (e) { console.error(e); }
      }

      if (!forceRefresh && cachedStockList.length > 0) {
        filterInventoryStockTable();
        return;
      }

      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align: center; padding: 40px; color: #64748b;">
            ⏳ '현재 재고' 시트 및 상품 마스터 데이터를 불러오는 중입니다...
          </td>
        </tr>
      `;

      try {
        let stockMap = {};

        // GAS_STOCK_URL 연동 시 '현재 재고' 시트 4번째 탭 데이터 수신
        if (GAS_STOCK_URL && GAS_STOCK_URL.startsWith("http")) {
          try {
            const response = await fetch(GAS_STOCK_URL);
            const result = await response.json();
            if (result && result.success && Array.isArray(result.data)) {
              result.data.forEach(sItem => {
                const code = String(sItem.productCode || sItem["상품코드"] || "").trim();
                if (code) {
                  stockMap[code] = Number(sItem.currentStock ?? sItem["현재 재고"] ?? sItem.stockQty ?? 0);
                }
              });
            }
          } catch (fetchErr) {
            console.warn("GAS_STOCK_URL Fetch Error:", fetchErr);
          }
        }

        // 상품 마스터 기준으로 현재 재고 매핑 (현재 재고 시트에 없으면 0)
        cachedStockList = cachedProductList.map(prod => {
          const pCode = (prod.productCode || prod.product_code || prod["상품코드"] || "").trim();
          const pName = prod.productName || prod.product_name || prod["상품명"] || "-";

          const currentQty = stockMap.hasOwnProperty(pCode) ? stockMap[pCode] : 0;

    function renderStockRows(list) {
      const tbody = document.getElementById("inventoryStockTableBody");
      if (!tbody) return;

      // 전체 cachedStockList 기준으로 상단 KPI 산출
      let totalProdWithStockCount = 0; // 재고 > 0 인 상품 종류 수
      let totalStockSum = 0;           // 모든 재고 수량의 합
      let overstockProdCount = 0;      // 사용자 입력 기준값(overstockThreshold) 초과 과다 재고 상품 종류 수

      cachedStockList.forEach(item => {
        const qty = item.currentStock || 0;
        if (qty > 0) {
          totalProdWithStockCount++;
        }
        totalStockSum += qty;

        if (qty > overstockThreshold) {
          overstockProdCount++;
        }
      });

      const kpiProdEl = document.getElementById("kpiTotalProductCount");
      const kpiStockEl = document.getElementById("kpiTotalStockQty");
      const kpiLowEl = document.getElementById("kpiLowStockCount");

      if (kpiProdEl) kpiProdEl.textContent = `${totalProdWithStockCount.toLocaleString()} 종`;
      if (kpiStockEl) kpiStockEl.textContent = `${totalStockSum.toLocaleString()} 개`;
      if (kpiLowEl) kpiLowEl.textContent = `${overstockProdCount.toLocaleString()} 종`;

      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px; color: #64748b;">
              검색 조건 또는 과다 재고 필터에 일치하는 현재 재고 항목이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map((item, index) => {
        const pCode = item.productCode || "-";
        const pName = item.productName || "-";
        const catL = item.categoryLarge || "-";
        const catM = item.categoryMid || "-";
        const vCode = item.vendorCode || "-";
        const vName = item.vendorName || "-";
        const qty = Number(item.currentStock || 0);

        const badgeClass = getBadgeClass(catL);
        const isOver = qty > overstockThreshold;

        return `
          <tr>
            <td style="text-align: center; color: #94a3b8; font-weight: 600;">${index + 1}</td>
            <td><strong>${pCode}</strong></td>
            <td>${pName}</td>
            <td><span class="badge ${badgeClass}">${catL}</span></td>
            <td>${catM}</td>
            <td>${vCode}</td>
            <td>${vName}</td>
            <td style="text-align: right; color: ${qty === 0 ? '#64748b' : (isOver ? '#ca8a04' : '#16a34a')}; font-weight: 700; font-size: 15px;">
              ${qty.toLocaleString()} 개
            </td>
          </tr>
        `;
      }).join("");
    }

    function filterInventoryStockTable() {
      const input = document.getElementById("stockSearchInput");
      const filterLargeSelect = document.getElementById("stockFilterCategoryLarge");
      const filterMidSelect = document.getElementById("stockFilterCategoryMid");

      const keyword = input ? input.value.trim().toLowerCase() : "";
      const selectedLarge = filterLargeSelect ? filterLargeSelect.value : "";
      const selectedMid = filterMidSelect ? filterMidSelect.value : "";

      let filtered = cachedStockList.filter(item => {
        const catL = (item.categoryLarge || "");
        const catM = (item.categoryMid || "");

        // 과다 재고 상품만 보기 필터 조건
        if (isOverstockOnly && item.currentStock <= overstockThreshold) {
          return false;
        }

        if (selectedLarge && catL !== selectedLarge) {
          return false;
        }

        if (selectedMid && catM !== selectedMid) {
          return false;
        }

        if (keyword) {
          const pCode = (item.productCode || "").toLowerCase();
          const pName = (item.productName || "").toLowerCase();
          const vCode = (item.vendorCode || "").toLowerCase();
          const vName = (item.vendorName || "").toLowerCase();

          const matchesKeyword = pCode.includes(keyword) || pName.includes(keyword) || 
                                 vCode.includes(keyword) || vName.includes(keyword) ||
                                 catL.toLowerCase().includes(keyword) || catM.toLowerCase().includes(keyword);
          if (!matchesKeyword) return false;
        }

        return true;
      });

      // 정렬 처리 (오름차순 / 내림차순 / 기본)
      if (stockSortDir === 'desc') {
        filtered.sort((a, b) => b.currentStock - a.currentStock);
      } else if (stockSortDir === 'asc') {
        filtered.sort((a, b) => a.currentStock - b.currentStock);
      }

      renderStockRows(filtered);
    }

    async function handleAdjustSubmit(e) {
      e.preventDefault();

      const adjDate = document.getElementById("adjDate").value;
      const productCode = document.getElementById("adjustProductCode").value.trim();
      const productName = document.getElementById("adjustProductName").value.trim();
      const vendorCode = document.getElementById("adjustVendorCode").value.trim();
      const vendorName = document.getElementById("adjustVendorName").value.trim();
      const adjQty = parseInt(document.getElementById("adjQty").value, 10);
      const adjReason = document.getElementById("adjReason").value.trim();
      const inspector = document.getElementById("adjustInspector").value;
      const regDate = getFormattedNowTimestamp();

      if (!productCode || !vendorCode) {
        alert("상품 마스터에서 등록된 상품을 먼저 검색하여 선택해 주세요.");
        return;
      }

      if (isNaN(adjQty)) {
        alert("올바른 재고 조정량을 입력해 주세요 (숫자).");
        return;
      }

      if (!adjReason) {
        alert("조정 사유를 입력해 주세요.");
        return;
      }

      const payload = {
        adjDate: adjDate,
        productCode: productCode,
        productName: productName,
        vendorCode: vendorCode,
        vendorName: vendorName,
        adjQty: adjQty,
        adjReason: adjReason,
        inspector: inspector,
        regDate: regDate,

        "재고 조정일": adjDate,
        "상품코드": productCode,
        "상품명": productName,
        "협력회사 코드": vendorCode,
        "협력회사 명": vendorName,
        "재고 조정량": adjQty,
        "조정 사유": adjReason,
        "검수자": inspector,
        "등록일": regDate
      };

      const btn = document.getElementById("adjustSubmitBtn");
      btn.disabled = true;
      btn.textContent = "⏳ 조정 등록 중입니다...";

      try {
        const response = await fetch(GAS_ADJUST_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        let res = {};
        try { res = JSON.parse(text); } catch(pErr) {}

        if (res && res.success) {
          alert("✅ 재고 조정 정보가 성공적으로 등록되었습니다!");
          cachedAdjustList = [];
          switchAdjustSubTab('search');
        } else {
          alert("✅ 재고 조정 등록이 완료되었습니다!");
          cachedAdjustList = [];
          switchAdjustSubTab('search');
        }
      } catch (err) {
        console.error("Inventory Adjust Submit Error:", err);
        alert("재고 조정 등록 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "⚙️ 재고 조정 등록하기";
        }
      }
    }

      }
    }

    function renderAdjustRows(list) {
      const tbody = document.getElementById("adjustTableBody");
      if (!tbody) return;

      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; padding: 40px; color: #64748b;">
              선택한 조정일 및 검색 조건에 해당하는 재고 조정 내역이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map((item, index) => {
        const rawAdjDate = item.adjDate || item["재고 조정일"] || "-";
        const aDate = normalizeDateStr(rawAdjDate) || String(rawAdjDate).split('T')[0] || "-";
        const pCode = item.productCode || item["상품코드"] || "-";
        const pName = item.productName || item["상품명"] || "-";
        const vCode = item.vendorCode || item["협력회사 코드"] || "-";
        const vName = item.vendorName || item["협력회사 명"] || "-";
        const qtyNum = Number(item.adjQty ?? item["재고 조정량"] ?? 0);
        const formattedQty = (qtyNum > 0 ? `+${qtyNum}` : `${qtyNum}`) + " 개";
        const qtyColor = qtyNum > 0 ? '#16a34a' : (qtyNum < 0 ? '#dc2626' : '#64748b');
        const reason = item.adjReason || item["조정 사유"] || "-";
        const insp = item.inspector || item["검수자"] || "-";
        
        let rawRegD = item.regDate || item.createdAt || item["등록일"] || "-";
        let regD = rawRegD;
        if (rawRegD !== "-") {
          const normR = normalizeDateStr(rawRegD);
          const timePart = String(rawRegD).split(' ')[4] || String(rawRegD).split('T')[1]?.substring(0,8) || "";
          regD = normR ? (timePart ? `${normR} ${timePart}` : normR) : rawRegD;
        }

        const escapedReason = String(reason).replace(/"/g, '&quot;');

        return `
          <tr>
            <td style="text-align: center; color: #94a3b8; font-weight: 600;">${index + 1}</td>
            <td><strong>${aDate}</strong></td>
            <td><strong>${pCode}</strong></td>
            <td>${pName}</td>
            <td>${vCode}</td>
            <td>${vName}</td>
            <td style="text-align: right; color: ${qtyColor}; font-weight: 700;">${formattedQty}</td>
            <td class="memo-cell" title="${escapedReason}">${reason}</td>
            <td><strong style="color: #0369a1;">${insp}</strong></td>
            <td style="font-size: 13px; color: #64748b;">${regD}</td>
          </tr>
        `;
      }).join("");
    }

    function filterAdjustTable() {
      const input = document.getElementById("adjustSearchInput");
      const fromInput = document.getElementById("adjustFilterFromDate");
      const toInput = document.getElementById("adjustFilterToDate");

      const keyword = input ? input.value.trim().toLowerCase() : "";
      const fromDate = fromInput ? fromInput.value : "";
      const toDate = toInput ? toInput.value : "";

      const filtered = cachedAdjustList.filter(item => {
        const rawDate = item.adjDate || item["재고 조정일"] || "";
        const normDate = normalizeDateStr(rawDate);

        if (fromDate && normDate && normDate < fromDate) {
          return false;
        }

        if (toDate && normDate && normDate > toDate) {
          return false;
        }

        if (keyword) {
          const pCode = (item.productCode || item["상품코드"] || "").toLowerCase();
          const pName = (item.productName || item["상품명"] || "").toLowerCase();
          const vCode = (item.vendorCode || item["협력회사 코드"] || "").toLowerCase();
          const vName = (item.vendorName || item["협력회사 명"] || "").toLowerCase();
          const reason = (item.adjReason || item["조정 사유"] || "").toLowerCase();
          const insp = (item.inspector || item["검수자"] || "").toLowerCase();

          const matchesKeyword = pCode.includes(keyword) || pName.includes(keyword) || 
                                 vCode.includes(keyword) || vName.includes(keyword) || 
                                 reason.includes(keyword) || insp.includes(keyword);
          if (!matchesKeyword) return false;
        }

        return true;
      });

      renderAdjustRows(filtered);
    }

    // =============================================================
    // [협력회사 마스터] 로직
    // =============================================================
    function renderPartnerMasterView() {
      contentDisplay.innerHTML = `
        <div class="master-container">
          <div class="search-card">
            <div class="search-form-row">
              <div class="field-group">
                <label for="searchVendorCode">협력회사 코드</label>
                <input 
                  type="text" 
                  id="searchVendorCode" 
                  placeholder="예: C0001 (1글자 이상 입력 후 Enter)"
                  onkeypress="if(event.key === 'Enter') handlePartnerSearch()"
                />
              </div>

              <div class="field-group">
                <label for="searchVendorName">협력회사명</label>
                <input 
                  type="text" 
                  id="searchVendorName" 
                  placeholder="예: test_a1 (1글자 이상 입력 후 Enter)"
                  onkeypress="if(event.key === 'Enter') handlePartnerSearch()"
                />
              </div>

              <div class="btn-group">
                <button type="button" class="action-btn btn-primary" onclick="handlePartnerSearch()">🔍 검색</button>
                <button type="button" class="action-btn btn-secondary" onclick="resetPartnerForm()">🔄 초기화</button>
              </div>
            </div>
          </div>

          <div class="card-box">
            <h4>🏢 협력회사 마스터 상세 정보</h4>
            
            <div class="form-grid">
              <div class="field-group">
                <label>협력회사 코드</label>
                <input type="text" id="detailVendorCode" readonly placeholder="검색 시 자동 채워짐" />
              </div>

              <div class="field-group">
                <label>협력회사명</label>
                <input type="text" id="detailVendorName" readonly placeholder="검색 시 자동 채워짐" />
              </div>

              <div class="field-group">
                <label>대표명</label>
                <input type="text" id="detailCeoName" readonly placeholder="검색 시 자동 채워짐" />
              </div>

              <div class="field-group">
                <label>사업자번호</label>
                <input type="text" id="detailBizNumber" readonly placeholder="검색 시 자동 채워짐" />
              </div>

              <div class="field-group">
                <label>담당자명</label>
                <input type="text" id="detailManagerName" readonly placeholder="검색 시 자동 채워짐" />
              </div>

              <div class="field-group">
                <label>담당자 이메일</label>
                <input type="text" id="detailManagerEmail" readonly placeholder="검색 시 자동 채워짐" />
              </div>

              <div class="field-group" style="grid-column: span 2;">
                <label>등록일</label>
                <input type="text" id="detailCreatedAt" readonly placeholder="검색 시 자동 채워짐" />
              </div>
            </div>
          </div>
        </div>
      `;

      loadPartnerData();
    }

    async function loadPartnerData() {
      if (cachedPartnerList.length > 0) return;

      try {
        const response = await fetch(GAS_PARTNER_URL);
        const result = await response.json();

        if (result && result.success && Array.isArray(result.data)) {
          cachedPartnerList = result.data;
        }
      } catch (err) {
        console.error("Partner Data Fetch Error:", err);
      }
    }

    async function handlePartnerSearch() {
      const codeInput = document.getElementById("searchVendorCode");
      const nameInput = document.getElementById("searchVendorName");

      const codeKeyword = codeInput.value.trim().toLowerCase();
      const nameKeyword = nameInput.value.trim().toLowerCase();
      const keyword = codeKeyword || nameKeyword;

      if (!keyword || keyword.length < 1) {
        alert("협력회사 코드 또는 협력회사명을 1글자 이상 입력해 주세요.");
        return;
      }

      if (cachedPartnerList.length === 0) {
        try {
          const response = await fetch(GAS_PARTNER_URL);
          const result = await response.json();
          if (result && result.success && Array.isArray(result.data)) {
            cachedPartnerList = result.data;
          }
        } catch (e) {
          alert("데이터를 서버에서 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.");
          return;
        }
      }

      const filtered = cachedPartnerList.filter(item => {
        const itemCode = (item.vendorCode || "").toLowerCase();
        const itemName = (item.vendorName || "").toLowerCase();
        return itemCode.includes(keyword) || itemName.includes(keyword);
      });

      if (filtered.length === 0) {
        alert(`'${keyword}' 와(과) 일치하는 협력회사가 없습니다.`);
        resetDetailFields();
      } else if (filtered.length === 1) {
        populateDetailForm(filtered[0]);
      } else {
        multipleSearchResults = filtered;
        openModalWithCustomHeader(
          "검색 결과 선택",
          "검색어와 일치하는 협력회사가 여러 건 발견되었습니다. 불러올 항목을 선택하세요.",
          ["선택", "협력회사 코드", "협력회사명", "대표명 / 담당자"],
          filtered.map(item => `
            <td><strong>${item.vendorCode || "-"}</strong></td>
            <td>${item.vendorName || "-"}</td>
            <td>${item.ceoName || "-"} / ${item.managerName || "-"}</td>
          `),
          (index) => {
            populateDetailForm(filtered[index]);
          }
        );
      }
    }

    function populateDetailForm(partner) {
      document.getElementById("searchVendorCode").value = partner.vendorCode || "";
      document.getElementById("searchVendorName").value = partner.vendorName || "";

      document.getElementById("detailVendorCode").value = partner.vendorCode || "-";
      document.getElementById("detailVendorName").value = partner.vendorName || "-";
      document.getElementById("detailCeoName").value = partner.ceoName || "-";
      document.getElementById("detailBizNumber").value = partner.bizNumber || "-";
      document.getElementById("detailManagerName").value = partner.managerName || "-";
      document.getElementById("detailManagerEmail").value = partner.managerEmail || "-";
      document.getElementById("detailCreatedAt").value = partner.createdAt || partner.regDate || "2026. 8. 18";
    }

    function resetDetailFields() {
      const fieldIds = [
        "detailVendorCode", "detailVendorName", "detailCeoName", 
        "detailBizNumber", "detailManagerName", "detailManagerEmail", "detailCreatedAt"
      ];
      fieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
    }

    function resetPartnerForm() {
      const codeInput = document.getElementById("searchVendorCode");
      const nameInput = document.getElementById("searchVendorName");
      if (codeInput) codeInput.value = "";
      if (nameInput) nameInput.value = "";
      resetDetailFields();
    }

    // =============================================================
    // [공통 모달 팝업] 로직
    // =============================================================
    function openModalWithCustomHeader(title, subTitle, headers, rowHtmls, onSelectCallback) {
      modalTitle.textContent = title;
      modalSubTitle.textContent = subTitle;
      modalSelectionCallback = onSelectCallback;

      modalTableHeader.innerHTML = headers.map(h => `<th>${h}</th>`).join("");
      modalTableBody.innerHTML = "";

      rowHtmls.forEach((rowHtml, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <button class="select-item-btn" onclick="triggerModalCallback(${index})">선택</button>
          </td>
          ${rowHtml}
        `;
        modalTableBody.appendChild(tr);
      });

      resultModal.style.display = "flex";
    }

    function triggerModalCallback(index) {
      if (modalSelectionCallback) {
        modalSelectionCallback(index);
      }
      closeModal();
    }

    function closeModal() {
      resultModal.style.display = "none";
      modalSelectionCallback = null;
    }

    // =============================================================
    // [상품분류 마스터] 로직
    // =============================================================
    function renderCategoryMasterView() {
      contentDisplay.innerHTML = `
        <div class="master-container">
          <div class="search-card">
            <div class="search-form-row">
              <div class="field-group" style="flex: 2;">
                <label for="categorySearchInput">분류 및 설명 실시간 검색</label>
                <input 
                  type="text" 
                  id="categorySearchInput" 
                  placeholder="대분류, 중분류 또는 설명 키워드를 입력하세요..."
                  onkeyup="filterCategoryTable()"
                />
              </div>

              <div class="btn-group">
                <button type="button" class="action-btn btn-secondary" onclick="loadCategoryData(true)">🔄 새로고침</button>
              </div>
            </div>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 70px; text-align: center;">번호</th>
                  <th style="width: 170px;">대분류</th>
                  <th style="width: 220px;">중분류</th>
                  <th>설명 (세부 품목)</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody">
                <tr>
                  <td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">
                    데이터를 불러오는 중입니다...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      loadCategoryData();
    }

    async function loadCategoryData(forceRefresh = false) {
      const tbody = document.getElementById("categoryTableBody");
      if (!tbody) return;

      if (!forceRefresh && cachedCategoryList.length > 0) {
        renderCategoryRows(cachedCategoryList);
        return;
      }

      tbody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">
            ⏳ 데이터를 불러오는 중입니다...
          </td>
        </tr>
      `;

      try {
        const response = await fetch(GAS_CATEGORY_URL);
        const result = await response.json();

        if (result && result.success && Array.isArray(result.data)) {
          cachedCategoryList = result.data;
          renderCategoryRows(cachedCategoryList);
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; padding: 40px; color: #dc2626;">
                ❌ 데이터를 불러오지 못했습니다.
              </td>
            </tr>
          `;
        }
      } catch (err) {
        console.error("Category Fetch Error:", err);
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; padding: 40px; color: #dc2626;">
              ⚠️ 통신 중 오류가 발생했습니다.
            </td>
          </tr>
        `;
      }
    }

    function renderCategoryRows(list) {
      const tbody = document.getElementById("categoryTableBody");
      if (!tbody) return;

      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">
              검색 결과와 일치하는 상품분류 항목이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map((item, index) => {
        const badgeClass = getBadgeClass(item.categoryLarge);
        return `
          <tr>
            <td style="text-align: center; color: #94a3b8; font-weight: 600;">${index + 1}</td>
            <td><span class="badge ${badgeClass}">${item.categoryLarge || "-"}</span></td>
            <td><strong>${item.categoryMid || "-"}</strong></td>
            <td style="color: #475569; line-height: 1.5;">${item.description || "-"}</td>
          </tr>
        `;
      }).join("");
    }

    function getBadgeClass(category) {
      if (!category) return "badge-tool";
      if (category.includes("스킨케어")) return "badge-skincare";
      if (category.includes("메이크업")) return "badge-makeup";
      if (category.includes("헤어")) return "badge-hair";
      if (category.includes("바디")) return "badge-body";
      if (category.includes("남성") || category.includes("옴므")) return "badge-homme";
      return "badge-tool";
    }

    function filterCategoryTable() {
      const searchInput = document.getElementById("categorySearchInput");
      if (!searchInput) return;

      const keyword = searchInput.value.trim().toLowerCase();

      if (!keyword) {
        renderCategoryRows(cachedCategoryList);
        return;
      }

      const filtered = cachedCategoryList.filter(item => {
        const large = (item.categoryLarge || "").toLowerCase();
        const mid = (item.categoryMid || "").toLowerCase();
        const desc = (item.description || "").toLowerCase();
        return large.includes(keyword) || mid.includes(keyword) || desc.includes(keyword);
      });

      renderCategoryRows(filtered);
    }
  </script>
